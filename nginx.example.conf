# Example nginx config for putting the frontend and backend behind ONE domain.
server {
    listen 80;
    server_name your-domain.com;

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:4000/uploads/;
    }

    location / {
        proxy_pass http://frontend:5173/;
        proxy_set_header Host $host;
    }
}

# For HTTPS, run this behind Caddy or use certbot — see the README's
# "Going worldwide" section for the simplest path (Caddy auto-HTTPS).
